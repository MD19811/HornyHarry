<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HORNY HARRY</title>
    <style>
        :root {
            --sky: #87CEEB;
            --grass: #2d5a27;
            --dirt: #5d4037;
            --ui-font: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body { margin: 0; overflow: hidden; background: #222; font-family: var(--ui-font); }

        #ui-layer {
            position: absolute; top: 20px; left: 20px;
            color: white; pointer-events: none; z-index: 5;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }
        .stat { font-size: 24px; margin-bottom: 5px; }
        .hint { font-size: 14px; opacity: 0.8; color: #ffeb3b; }

        #reward-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: none; background: rgba(0,0,0,0.95); z-index: 20;
            justify-content: center; align-items: center; flex-direction: column;
            cursor: pointer; animation: fadeIn 0.5s;
        }
        #reward-overlay img {
            max-width: 90vw; max-height: 80vh;
            border: 10px solid #fff; border-radius: 4px;
            object-fit: contain;
        }

        #death-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: none; background: rgba(180, 0, 0, 0.8); z-index: 15;
            justify-content: center; align-items: center;
            color: white; font-size: 60px; font-weight: 900;
        }

        canvas { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="stat">Level: <span id="lvl">1</span></div>
        <div class="stat">Deaths: <span id="deaths">0</span> | Kills: <span id="kills">0</span></div>
        <div class="hint">ARROWS: Move & <b>HOLD DOWN TO DUCK</b> | SPACE: Jump | <b>S: SHOOT</b></div>
    </div>

    <div id="death-overlay">OOPS! DOOD!</div>

    <div id="reward-overlay" onclick="game.nextLevel()">
        <img id="reward-img" src="" alt="Victory Image">
        <p style="color: white; font-size: 20px; margin-top: 15px;">Nice! Click to play Level <span id="next-lvl-hint"></span></p>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const SPRITE_SRC = 'images/ventje.png';
const DUCK_SRC = 'images/ducked.png';
const UFO_SRC = 'images/ufo.png';

const game = {
    level: 1,
    deathCount: 0,
    killCount: 0,
    paused: false,
    gravity: 0.8,
    friction: 0.8,
    keys: {},
    platforms: [],
    dogs: [],
    ufos: [],
    bullets: [],
    enemyBullets: [],
    clouds: [],
    cameraX: 0,
    levelWidth: 0,

    init() {
        this.player = new Player();
        this.loadLevel(this.level);
        this.loop();
    },

    loadLevel(n) {
        document.getElementById('lvl').innerText = n;
        document.getElementById('next-lvl-hint').innerText = n + 1;
        this.player.reset();
        this.dogs = [];
        this.ufos = [];
        this.platforms = [];
        this.clouds = [];
        this.bullets = [];
        this.enemyBullets = [];
        this.cameraX = 0;

        this.levelWidth = 3000 + (n * 1000);
        const groundY = canvas.height - 100;

        for(let i = 0; i < 25; i++) {
            this.clouds.push({
                x: Math.random() * this.levelWidth,
                y: Math.random() * (canvas.height / 2),
                w: 100 + Math.random() * 100,
                s: 0.1 + Math.random() * 0.3
            });
        }

        // Spawn UFOs
        for(let i = 0; i < n; i++) {
            this.ufos.push(new UFO(1000 + (i * 1500), 100 + Math.random() * 150));
        }

        let currentX = 0;
        let lastY = groundY;

        this.platforms.push({ x: 0, y: groundY, w: 600, h: 800 });
        currentX = 600;

        while (currentX < this.levelWidth - 800) {
            let gap = 150 + Math.random() * 300;
            let pWidth = 300 + Math.random() * 500;
            let heightChange = (Math.random() - 0.5) * 350;
            let pY = Math.max(canvas.height * 0.3, Math.min(lastY + heightChange, groundY));

            this.platforms.push({ x: currentX + gap, y: pY, w: pWidth, h: 1000 });

            if (Math.random() > 0.4) {
                this.dogs.push(new Dog(currentX + gap + 50, pY - 55, pWidth - 100, 3 + (n * 0.3)));
            }

            currentX += gap + pWidth;
            lastY = pY;
        }

        this.platforms.push({ x: this.levelWidth - 700, y: groundY, w: 700, h: 800 });
        this.door = { x: this.levelWidth - 200, y: groundY - 110, w: 70, h: 110 };
    },

    die() {
        if (this.paused) return;
        this.paused = true;
        this.deathCount++;
        document.getElementById('deaths').innerText = this.deathCount;
        document.getElementById('death-overlay').style.display = 'flex';
        setTimeout(() => {
            document.getElementById('death-overlay').style.display = 'none';
            this.paused = false;
            this.loadLevel(this.level);
        }, 1200);
    },

    win() {
        this.paused = true;
        const img = document.getElementById('reward-img');
        let randomNum = Math.floor(Math.random() * 200) + 1;
        let formattedNum = randomNum.toString().padStart(2, '0');
        img.src = `https://md19811.github.io/Manillen/randomM/${formattedNum}.jpg`;
        document.getElementById('reward-overlay').style.display = 'flex';
    },

    nextLevel() {
        document.getElementById('reward-overlay').style.display = 'none';
        this.level++;
        this.paused = false;
        this.loadLevel(this.level);
    },

    loop() {
        if (!this.paused) {
            this.update();
            this.draw();
        }
        requestAnimationFrame(() => this.loop());
    },

    update() {
        this.player.update(this.keys, this.platforms, this.gravity, this.friction);

        let targetCamX = this.player.x - canvas.width / 2;
        this.cameraX += (targetCamX - this.cameraX) * 0.08;
        this.cameraX = Math.max(0, Math.min(this.cameraX, this.levelWidth - canvas.width));

        this.bullets.forEach((b, idx) => {
            b.x += b.vx;
            b.y += (b.vy || 0);
            if (Math.abs(b.x - this.player.x) > canvas.width) this.bullets.splice(idx, 1);

            this.dogs.forEach((dog, dIdx) => {
                if (this.rectIntersect(b, dog)) {
                    this.dogs.splice(dIdx, 1);
                    this.bullets.splice(idx, 1);
                    this.killCount++;
                    document.getElementById('kills').innerText = this.killCount;
                }
            });

            this.ufos.forEach((u, uIdx) => {
                if (this.rectIntersect(b, u)) {
                    this.ufos.splice(uIdx, 1);
                    this.bullets.splice(idx, 1);
                    this.killCount += 5;
                    document.getElementById('kills').innerText = this.killCount;
                }
            });
        });

        this.enemyBullets.forEach((eb, idx) => {
            eb.x += eb.vx;
            eb.y += (eb.vy || 0); // Handle diagonal UFO bullets[cite: 1]
            if (Math.abs(eb.x - this.player.x) > canvas.width || eb.y > canvas.height) {
                this.enemyBullets.splice(idx, 1);
            }

            if (this.rectIntersect(eb, this.player)) {
                this.enemyBullets.splice(idx, 1);
                this.die();
            }
        });

        if (this.player.y > canvas.height + 200) this.die();

        this.dogs.forEach(dog => dog.update());
        this.ufos.forEach(ufo => ufo.update());

        if (this.rectIntersect(this.player, this.door)) this.win();
    },

    draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let grad = ctx.createLinearGradient(0,0,0, canvas.height);
        grad.addColorStop(0, '#87CEEB');
        grad.addColorStop(1, '#E0F6FF');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(-this.cameraX, 0);

        this.clouds.forEach(c => {
            ctx.fillStyle = "rgba(255,255,255,0.6)";
            ctx.beginPath();
            ctx.ellipse(c.x + (this.cameraX * c.s), c.y, c.w, c.w/2, 0, 0, Math.PI*2);
            ctx.fill();
        });

        this.platforms.forEach(p => {
            ctx.fillStyle = '#2d5a27'; ctx.fillRect(p.x, p.y, p.w, 15);
            ctx.fillStyle = '#5d4037'; ctx.fillRect(p.x, p.y + 15, p.w, p.h);
        });

        ctx.fillStyle = "#4b806b";
        this.bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

        this.enemyBullets.forEach(eb => {
            ctx.fillStyle = eb.color || "#ff5252";
            ctx.fillRect(eb.x, eb.y, eb.w, eb.h);
        });


                // Draw Door
		        ctx.fillStyle = '#3e2723';
		        ctx.fillRect(this.door.x, this.door.y, this.door.w, this.door.h);

		        // Add "HOEREKOT" above the door
		        ctx.fillStyle = 'white';
		        ctx.font = 'bold 20px Segoe UI';
		        ctx.textAlign = 'center';
		        ctx.fillText("HOEREKOT", this.door.x + this.door.w / 2, this.door.y - 15);

		        ctx.fillStyle = '#ffd600';
        ctx.beginPath(); ctx.arc(this.door.x + 15, this.door.y + 55, 6, 0, Math.PI*2); ctx.fill();





        this.dogs.forEach(d => d.draw());
        this.ufos.forEach(u => u.draw());
        this.player.draw();

        ctx.restore();
    },

    rectIntersect(r1, r2) {
        let r1w = r1.w;
        let r1h = r1.h;
        let r1x = r1.x;
        let r1y = r1.y;

        if (r1 instanceof Player && r1.isDucking) {
            r1h = r1.h * 0.5;
            r1y = r1.y + (r1.h * 0.5);
        }

        return !(r2.x > r1x + r1w || r2.x + r2.w < r1x ||
                 r2.y > r1y + r1h || r2.y + r2.h < r1y);
    }
};

class Player {
    constructor() {
        this.img = new Image();
        this.img.src = SPRITE_SRC;
        this.duckImg = new Image();
        this.duckImg.src = DUCK_SRC;
        this.w = 120; this.h = 150;
        this.reset();
    }
    reset() {
        this.x = 150; this.y = 100; this.vx = 0; this.vy = 0;
        this.grounded = false; this.flip = false;
        this.jumps = 0; this.canShoot = true; this.isDucking = false;
    }
    update(keys, platforms, gravity, friction) {
        if (keys[40] && this.grounded) {
            this.isDucking = true;
            this.vx = 0;
        } else {
            this.isDucking = false;
        }

        if (!this.isDucking) {
            if (keys[39]) { this.vx += 1.2; this.flip = false; }
            if (keys[37]) { this.vx -= 1.2; this.flip = true; }
        }

        if (keys[83] && this.canShoot) {
            this.shoot();
            this.canShoot = false;
            setTimeout(() => this.canShoot = true, 250);
        }

        this.vx *= friction;
        this.vy += gravity;
        this.grounded = false;

        platforms.forEach(p => {
            if (this.x < p.x + p.w && this.x + this.w > p.x && this.y + this.h > p.y && this.y + this.h < p.y + p.h) {
                if (this.vy > 0) {
                    this.vy = 0;
                    this.y = p.y - this.h;
                    this.grounded = true;
                    this.jumps = 0;
                }
            }
        });

        this.x += this.vx; this.y += this.vy;
    }
    jump() {
        if (!this.isDucking && (this.grounded || this.jumps < 2)) {
            this.vy = -18;
            this.jumps++;
            this.grounded = false;
        }
    }
   shoot() {
           // Bullet starting height adjusts if the player is ducking
           let bulletY = this.isDucking ? this.y + this.h - 45 : this.y + this.h/2;
           let bulletX = this.flip ? this.x : this.x + this.w;

           let vx = this.flip ? -16 : 16;
           let vy = 0;

           // Aiming Logic: Find the nearest UFO to target
           if (game.ufos.length > 0) {
               let nearestUfo = null;
               let minDist = 800; // Aiming range

               game.ufos.forEach(u => {
                   let d = Math.sqrt(Math.pow(u.x - this.x, 2) + Math.pow(u.y - this.y, 2));
                   if (d < minDist) {
                       minDist = d;
                       nearestUfo = u;
                   }
               });

               if (nearestUfo) {
                   const dx = (nearestUfo.x + nearestUfo.w / 2) - bulletX;
                   const dy = (nearestUfo.y + nearestUfo.h / 2) - bulletY;
                   const angle = Math.atan2(dy, dx);
                   const speed = 16;
                   vx = Math.cos(angle) * speed;
                   vy = Math.sin(angle) * speed;
               }
           }

           game.bullets.push({
               x: bulletX,
               y: bulletY,
               w: 20, h: 6,
               vx: vx,
               vy: vy
           });
    }
    draw() {
        ctx.save();
        let activeImg = this.isDucking ? this.duckImg : this.img;
        if (this.flip) {
            ctx.scale(-1, 1);
            ctx.drawImage(activeImg, -(this.x) - this.w, this.y, this.w, this.h);
        } else {
            ctx.drawImage(activeImg, this.x, this.y, this.w, this.h);
        }
        ctx.restore();
    }
}

class UFO {
    constructor(x, y) {
        this.x = x; this.y = y; this.w = 120; this.h = 60;
        this.startX = x; this.startY = y;
        this.img = new Image();
        this.img.src = UFO_SRC;
        this.time = 0;
        this.shootTimer = 0;
    }
    update() {
        this.time += 0.02;
        this.x = this.startX + Math.sin(this.time) * 400;
        this.y = this.startY + Math.cos(this.time * 2) * 60;

        this.shootTimer++;
        // Higher threshold (150 vs dogs 100) means less frequent shots
        if (this.shootTimer > 150) {
            const playerCenterX = game.player.x + game.player.w / 2;
            const playerCenterY = game.player.y + game.player.h / 2;
            const ufoCenterX = this.x + this.w / 2;
            const ufoCenterY = this.y + this.h / 2;

            // Calculate angle towards player[cite: 1]
            const dx = playerCenterX - ufoCenterX;
            const dy = playerCenterY - ufoCenterY;
            const angle = Math.atan2(dy, dx);
            const speed = 7;

            game.enemyBullets.push({
                x: ufoCenterX,
                y: ufoCenterY,
                w: 12, h: 12,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                color: "#2ecc71" // Green bullets[cite: 1]
            });
            this.shootTimer = 0;
        }
    }
    draw() {
        ctx.drawImage(this.img, this.x, this.y, this.w, this.h);
    }
}

class Dog {
    constructor(x, y, range, speed) {
        this.startX = x; this.x = x; this.y = y; this.w = 75; this.h = 55;
        this.range = Math.max(range, 60); this.speed = speed;
        this.shootTimer = Math.random() * 100;
        const monsterNum = Math.floor(Math.random() * 4) + 1;
        this.img = new Image();
        this.img.src = `images/monster${monsterNum}.png`;
    }
    update() {
        this.x += this.speed;
        if (this.x > this.startX + this.range || this.x < this.startX) this.speed = -this.speed;
        this.shootTimer++;
        if (this.shootTimer > 100) {
            if (Math.abs(this.x - game.player.x) < 600) {
                this.shoot();
                this.shootTimer = 0;
            }
        }
    }
    shoot() {
        const dir = (game.player.x < this.x) ? -8 : 8;
        game.enemyBullets.push({
            x: this.x + this.w/2,
            y: this.y + this.h/2,
            w: 15, h: 5,
            vx: dir,
            color: "#ff5252"
        });
    }
    draw() {
        ctx.save();
        if (this.speed > 0) {
            ctx.scale(-1, 1);
            ctx.drawImage(this.img, -this.x - this.w, this.y, this.w, this.h);
        } else {
            ctx.drawImage(this.img, this.x, this.y, this.w, this.h);
        }
        ctx.restore();
    }
}

window.addEventListener('keydown', e => {
    game.keys[e.keyCode] = true;
    if (e.keyCode === 32) game.player.jump();
});
window.addEventListener('keyup', e => {
    game.keys[e.keyCode] = false;
});

game.init();
</script>
</body>
</html>
